<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>约束即配置：加模型 = 加一行声明式画像，而不是往代码里堆 if/else</title>
<style>

  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b;
    --neutral:#e2e8f0; --input:#bfdbfe; --process:#c7d2fe; --storage:#99f6e4;
    --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#a3adbd;
    --line:#94a3b8; --neutral:#334155; --input:#1d4ed8; --process:#4338ca; --storage:#0f766e;
    --external:#92400e; --risk:#991b1b; --wiki:#5b4b9e; } }
  @media print {
    :root { color-scheme: light; --bg:#ffffff; --fg:#111827; --muted:#4b5563; --line:#6b7280;
      --neutral:#e5e7eb; --input:#bfdbfe; --process:#c7d2fe; --storage:#a7f3d0;
      --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
    body { margin:0; }
    .stage { border:0.025in solid #6b7280; break-inside:avoid; }
    .node, .zone { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  body { background:var(--bg); color:var(--fg); margin:16px; line-height:1.525; font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:17px; margin:0 0 4px; font-weight:600; letter-spacing:.025em; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.55; }
  .stage { position:relative; width:1320px; height:500px; border:1px solid var(--line); border-radius:8px; margin-top:8px; overflow:hidden; }
  svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .node { position:absolute; border-radius:8px; border:1.4px solid; padding:6px 10px; box-sizing:border-box;
    font-size:12.5px; display:flex; flex-direction:column; justify-content:center; z-index:2; color:var(--fg); }
  .node b { font-weight:600; }
  .node small { font-size:10px; color:var(--fg); opacity:.72; margin-top:2px; line-height:1.3; }
  .node.neutral   { background:var(--neutral); border-color:var(--line); }
  .node.input     { background:var(--input);   border-color:var(--line); }
  .node.process   { background:var(--process); border-color:var(--line); }
  .node.storage   { background:var(--storage); border-color:var(--line); }
  .node.external  { background:var(--external);border-color:var(--line); }
  .node.risk      { background:var(--risk);    border-color:var(--line); }
  .zone { position:absolute; border:1.4px dashed var(--line); border-radius:10px; z-index:1; }
  .zone.tinted { background:color-mix(in srgb, var(--line) 7%, transparent); }
  .zone.hl { border-style:solid; border-width:2px; border-color:var(--process); background:color-mix(in srgb, var(--process) 8%, transparent); }
  .zone-label { position:absolute; top:-4px; left:10px; font-size:12px; color:var(--muted);
    background:var(--bg); padding:0 6px; font-weight:600; white-space:nowrap; }
  .zone-note { position:absolute; left:14px; right:14px; bottom:8px; font-size:11px;
    color:var(--muted); line-height:1.4; opacity:.94; }
</style>
</head>
<body>
<h1>约束即配置：加模型 = 加一行声明式画像，而不是往代码里堆 if/else</h1>
<div class="sub">A3 · 选型是一堆约束，约束应可声明、可审计、可演化 —— 承第四篇《选型是求解》</div>
<div class="stage">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 500">
  <polyline points="250.0,375.0 250.0,150.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="250.0" cy="375.0" r="2.6" fill="var(--line)"/><circle cx="250.0" cy="150.0" r="3.0" fill="var(--line)"/>
    <rect x="211.6" y="270.0" width="76.8" height="18.0" rx="4" fill="var(--bg)"/><text x="250.0" y="285.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">需求翻译成约束字段</text>
    <polyline points="250.0,150.0 457.5,150.0 457.5,155.0 665.0,155.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="250.0" cy="150.0" r="2.6" fill="var(--line)"/><circle cx="665.0" cy="155.0" r="3.0" fill="var(--line)"/>
    <rect x="451.6" y="137.5" width="76.8" height="18.0" rx="4" fill="var(--bg)"/><text x="490.0" y="152.5" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">描述式数据驱动求解</text>
    <polyline points="665.0,155.0 835.0,155.0 835.0,125.0 1005.0,125.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="665.0" cy="155.0" r="2.6" fill="var(--line)"/><circle cx="1005.0" cy="125.0" r="3.0" fill="var(--line)"/>
    <rect x="793.0" y="125.0" width="84.0" height="18.0" rx="4" fill="var(--bg)"/><text x="835.0" y="140.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">裁决留痕，约束即证据</text>
    <polyline points="250.0,375.0 457.5,375.0 665.0,375.0" fill="none" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="6,4"/><circle cx="250.0" cy="375.0" r="2.6" fill="var(--line)"/><circle cx="665.0" cy="375.0" r="3.0" fill="var(--line)"/>
    <rect x="430.0" y="360.0" width="120.0" height="18.0" rx="4" fill="var(--bg)"/><text x="490.0" y="375.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">反范式：本能堆 if/else</text>
  </svg>
  <div class="node storage" style="left:80px;top:60px;width:340px;height:180px"><b>声明式模型画像（schema）</b><small>硬约束字段 · 软约束权重 · 显式失败标记&#10;加模型 = 在这里加一行配置</small></div>
    <div class="node process" style="left:560px;top:90px;width:210px;height:130px"><b>配置引擎 · 求解器</b><small>约束满足求解&#10;不含业务 if/else</small></div>
    <div class="node storage" style="left:900px;top:60px;width:210px;height:130px"><b>裁决留痕</b><small>每次裁决对应哪行约束&#10;都可回查 = 审计证据</small></div>
    <div class="node input" style="left:80px;top:330px;width:340px;height:90px"><b>一次需求 / 新模型接入</b><small>把「要」与「必须」参数化&#10;交回画像，不进分支代码</small></div>
    <div class="node risk" style="left:560px;top:330px;width:210px;height:90px"><b>命令式 if/else 堆叠</b><small>改一行逻辑=改一段代码&#10;不可审计 · 难演化</small></div>
</div>
</body>
</html>
