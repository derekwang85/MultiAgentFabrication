<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>治理门禁：规矩不进调度，调度就敢空转</title>
<style>

  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b;
    --neutral:#e2e8f0; --input:#bfdbfe; --process:#c7d2fe; --storage:#99f6e4;
    --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#a3adbd;
    --line:#94a3b8; --neutral:#334155; --input:#1d4ed8; --process:#4338ca; --storage:#0f766e;
    --external:#92400e; --risk:#991b1b; --wiki:#5b4b9e; } }
  @media print {
    :root { color-scheme: light; --bg:#ffffff; --fg:#111827; --muted:#4b5563; --line:#6b7280;
      --neutral:#e5e7eb; --input:#bfdbfe; --process:#c7d2fe; --storage:#a7f3d0;
      --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
    body { margin:0; }
    .stage { border:0.025in solid #6b7280; break-inside:avoid; }
    .node, .zone { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  body { background:var(--bg); color:var(--fg); margin:16px; line-height:1.525; font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:17px; margin:0 0 4px; font-weight:600; letter-spacing:.025em; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.55; }
  .stage { position:relative; width:1320px; height:540px; border:1px solid var(--line); border-radius:8px; margin-top:8px; overflow:hidden; }
  svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .node { position:absolute; border-radius:8px; border:1.4px solid; padding:6px 10px; box-sizing:border-box;
    font-size:12.5px; display:flex; flex-direction:column; justify-content:center; z-index:2; color:var(--fg); }
  .node b { font-weight:600; }
  .node small { font-size:10px; color:var(--fg); opacity:.72; margin-top:2px; line-height:1.3; }
  .node.neutral   { background:var(--neutral); border-color:var(--line); }
  .node.input     { background:var(--input);   border-color:var(--line); }
  .node.process   { background:var(--process); border-color:var(--line); }
  .node.storage   { background:var(--storage); border-color:var(--line); }
  .node.external  { background:var(--external);border-color:var(--line); }
  .node.risk      { background:var(--risk);    border-color:var(--line); }
  .zone { position:absolute; border:1.4px dashed var(--line); border-radius:10px; z-index:1; }
  .zone.tinted { background:color-mix(in srgb, var(--line) 7%, transparent); }
  .zone.hl { border-style:solid; border-width:2px; border-color:var(--process); background:color-mix(in srgb, var(--process) 8%, transparent); }
  .zone-label { position:absolute; top:-4px; left:10px; font-size:12px; color:var(--muted);
    background:var(--bg); padding:0 6px; font-weight:600; white-space:nowrap; }
  .zone-note { position:absolute; left:14px; right:14px; bottom:8px; font-size:11px;
    color:var(--muted); line-height:1.4; opacity:.94; }
</style>
</head>
<body>
<h1>治理门禁：规矩不进调度，调度就敢空转</h1>
<div class="sub">A5 · 规则治理 —— 确定性不变量门前置，MCP 权限当闸，而不是当摆设</div>
<div class="stage">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 540">
  <polyline points="120.0,280.0 265.0,280.0 265.0,120.0 410.0,120.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="120.0" cy="280.0" r="2.6" fill="var(--line)"/><circle cx="410.0" cy="120.0" r="3.0" fill="var(--line)"/>
    <rect x="237.4" y="185.0" width="55.2" height="18.0" rx="4" fill="var(--bg)"/><text x="265.0" y="200.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">请求先进门禁</text>
    <polyline points="410.0,120.0 410.0,300.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="410.0" cy="120.0" r="2.6" fill="var(--line)"/><circle cx="410.0" cy="300.0" r="3.0" fill="var(--line)"/>
    <rect x="375.2" y="195.0" width="69.6" height="18.0" rx="4" fill="var(--bg)"/><text x="410.0" y="210.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">规矩过了，才派活</text>
    <polyline points="410.0,300.0 720.0,300.0 720.0,240.0 1030.0,240.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="410.0" cy="300.0" r="2.6" fill="var(--line)"/><circle cx="1030.0" cy="240.0" r="3.0" fill="var(--line)"/>
    <rect x="670.8" y="255.0" width="98.4" height="18.0" rx="4" fill="var(--bg)"/><text x="720.0" y="270.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">每笔入账留痕，交三权复核</text>
    <polyline points="410.0,300.0 565.0,300.0 565.0,470.0 720.0,470.0" fill="none" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="6,4"/><circle cx="410.0" cy="300.0" r="2.6" fill="var(--line)"/><circle cx="720.0" cy="470.0" r="3.0" fill="var(--line)"/>
    <rect x="519.4" y="370.0" width="91.2" height="18.0" rx="4" fill="var(--bg)"/><text x="565.0" y="385.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">反范式：无门禁直接派活</text>
  </svg>
  <div class="node input" style="left:20px;top:230px;width:200px;height:100px"><b>一次请求</b><small>请求 / 任务意图&#10;先过门禁再谈派活</small></div>
    <div class="node process" style="left:280px;top:70px;width:260px;height:100px"><b>规矩门禁</b><small>确定性不变量 · 先立规矩&#10;没给门槛 = 没接得住</small></div>
    <div class="node process" style="left:280px;top:250px;width:260px;height:100px"><b>调度派活</b><small>MCP / Agent 编排&#10;规矩过了，才轮到它</small></div>
    <div class="node storage" style="left:900px;top:170px;width:260px;height:140px"><b>三权账并行</b><small>报告≠修复≠验证&#10;每笔派活入账，交独立复核</small></div>
    <div class="node risk" style="left:610px;top:420px;width:220px;height:100px"><b>空转失控</b><small>无门禁直接派活&#10;Agent 越转越密，账越空</small></div>
</div>
</body>
</html>
