<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>三权分立：报告 ≠ 修复 ≠ 验证，同一双手也要时间隔离</title>
<style>

  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b;
    --neutral:#e2e8f0; --input:#bfdbfe; --process:#c7d2fe; --storage:#99f6e4;
    --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#a3adbd;
    --line:#94a3b8; --neutral:#334155; --input:#1d4ed8; --process:#4338ca; --storage:#0f766e;
    --external:#92400e; --risk:#991b1b; --wiki:#5b4b9e; } }
  @media print {
    :root { color-scheme: light; --bg:#ffffff; --fg:#111827; --muted:#4b5563; --line:#6b7280;
      --neutral:#e5e7eb; --input:#bfdbfe; --process:#c7d2fe; --storage:#a7f3d0;
      --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
    body { margin:0; }
    .stage { border:0.025in solid #6b7280; break-inside:avoid; }
    .node, .zone { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  body { background:var(--bg); color:var(--fg); margin:16px; line-height:1.525; font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:17px; margin:0 0 4px; font-weight:600; letter-spacing:.025em; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.55; }
  .stage { position:relative; width:1360px; height:860px; border:1px solid var(--line); border-radius:8px; margin-top:8px; overflow:hidden; }
  svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .node { position:absolute; border-radius:8px; border:1.4px solid; padding:6px 10px; box-sizing:border-box;
    font-size:12.5px; display:flex; flex-direction:column; justify-content:center; z-index:2; color:var(--fg); }
  .node b { font-weight:600; }
  .node small { font-size:10px; color:var(--fg); opacity:.72; margin-top:2px; line-height:1.3; }
  .node.neutral   { background:var(--neutral); border-color:var(--line); }
  .node.input     { background:var(--input);   border-color:var(--line); }
  .node.process   { background:var(--process); border-color:var(--line); }
  .node.storage   { background:var(--storage); border-color:var(--line); }
  .node.external  { background:var(--external);border-color:var(--line); }
  .node.risk      { background:var(--risk);    border-color:var(--line); }
  .zone { position:absolute; border:1.4px dashed var(--line); border-radius:10px; z-index:1; }
  .zone.tinted { background:color-mix(in srgb, var(--line) 7%, transparent); }
  .zone.hl { border-style:solid; border-width:2px; border-color:var(--process); background:color-mix(in srgb, var(--process) 8%, transparent); }
  .zone-label { position:absolute; top:-4px; left:10px; font-size:12px; color:var(--muted);
    background:var(--bg); padding:0 6px; font-weight:600; white-space:nowrap; }
  .zone-note { position:absolute; left:14px; right:14px; bottom:8px; font-size:11px;
    color:var(--muted); line-height:1.4; opacity:.94; }
</style>
</head>
<body>
<h1>三权分立：报告 ≠ 修复 ≠ 验证，同一双手也要时间隔离</h1>
<div class="sub">A2 · 分工切开的每一环，都要过「报告人-修复人-验证人」三双不同的手</div>
<div class="stage">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 860">
  <polyline points="680.0,140.0 480.0,140.0 480.0,510.0 280.0,510.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="680.0" cy="140.0" r="2.6" fill="var(--line)"/><circle cx="280.0" cy="510.0" r="3.0" fill="var(--line)"/>
    <rect x="438.0" y="310.0" width="84.0" height="18.0" rx="4" fill="var(--bg)"/><text x="480.0" y="325.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">报告转修复（带规格）</text>
    <polyline points="280.0,510.0 680.0,510.0 1080.0,510.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="280.0" cy="510.0" r="2.6" fill="var(--line)"/><circle cx="1080.0" cy="510.0" r="3.0" fill="var(--line)"/>
    <rect x="638.0" y="495.0" width="84.0" height="18.0" rx="4" fill="var(--bg)"/><text x="680.0" y="510.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">交付给验证（带证据）</text>
    <polyline points="1080.0,510.0 880.0,510.0 880.0,705.0 680.0,705.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="1080.0" cy="510.0" r="2.6" fill="var(--line)"/><circle cx="680.0" cy="705.0" r="3.0" fill="var(--line)"/>
    <rect x="856.0" y="590.0" width="48.0" height="18.0" rx="4" fill="var(--bg)"/><text x="880.0" y="605.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">复验或退回</text>
    <polyline points="680.0,705.0 680.0,140.0" fill="none" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="6,4"/><circle cx="680.0" cy="705.0" r="2.6" fill="var(--line)"/><circle cx="680.0" cy="140.0" r="3.0" fill="var(--line)"/>
    <rect x="645.2" y="405.0" width="69.6" height="18.0" rx="4" fill="var(--bg)"/><text x="680.0" y="420.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">回看，形成下一轮</text>
  </svg>
  <div class="zone" style="left:24px;top:40px;width:1312px;height:780px"><span class="zone-label">三权分立 · 任一环节的问责闭环</span></div>
    <div class="node process" style="left:520px;top:90px;width:320px;height:100px"><b>报告人 R</b><small>只负责如实上报「哪里不对」，不负责改</small></div>
    <div class="node process" style="left:120px;top:460px;width:320px;height:100px"><b>修复人 F</b><small>只负责消除根因，不接受「可能没问题」的糊话</small></div>
    <div class="node process" style="left:920px;top:460px;width:320px;height:100px"><b>验证人 V</b><small>只负责用可复现基准裁断，不参与修复</small></div>
    <div class="node external" style="left:520px;top:650px;width:320px;height:110px"><b>时间隔离</b><small>修完立刻自验约 100% 过&#10;隔 30 分钟后复验，发现率翻倍</small></div>
</div>
</body>
</html>
