<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>熵的账本：留痕就是可回放的记忆，忘掉的判断才算丢</title>
<style>

  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b;
    --neutral:#e2e8f0; --input:#bfdbfe; --process:#c7d2fe; --storage:#99f6e4;
    --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#a3adbd;
    --line:#94a3b8; --neutral:#334155; --input:#1d4ed8; --process:#4338ca; --storage:#0f766e;
    --external:#92400e; --risk:#991b1b; --wiki:#5b4b9e; } }
  @media print {
    :root { color-scheme: light; --bg:#ffffff; --fg:#111827; --muted:#4b5563; --line:#6b7280;
      --neutral:#e5e7eb; --input:#bfdbfe; --process:#c7d2fe; --storage:#a7f3d0;
      --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
    body { margin:0; }
    .stage { border:0.025in solid #6b7280; break-inside:avoid; }
    .node, .zone { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  body { background:var(--bg); color:var(--fg); margin:16px; line-height:1.525; font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:17px; margin:0 0 4px; font-weight:600; letter-spacing:.025em; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.55; }
  .stage { position:relative; width:980px; height:700px; border:1px solid var(--line); border-radius:8px; margin-top:8px; overflow:hidden; }
  svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .node { position:absolute; border-radius:8px; border:1.4px solid; padding:6px 10px; box-sizing:border-box;
    font-size:12.5px; display:flex; flex-direction:column; justify-content:center; z-index:2; color:var(--fg); }
  .node b { font-weight:600; }
  .node small { font-size:10px; color:var(--fg); opacity:.72; margin-top:2px; line-height:1.3; }
  .node.neutral   { background:var(--neutral); border-color:var(--line); }
  .node.input     { background:var(--input);   border-color:var(--line); }
  .node.process   { background:var(--process); border-color:var(--line); }
  .node.storage   { background:var(--storage); border-color:var(--line); }
  .node.external  { background:var(--external);border-color:var(--line); }
  .node.risk      { background:var(--risk);    border-color:var(--line); }
  .zone { position:absolute; border:1.4px dashed var(--line); border-radius:10px; z-index:1; }
  .zone.tinted { background:color-mix(in srgb, var(--line) 7%, transparent); }
  .zone.hl { border-style:solid; border-width:2px; border-color:var(--process); background:color-mix(in srgb, var(--process) 8%, transparent); }
  .zone-label { position:absolute; top:-4px; left:10px; font-size:12px; color:var(--muted);
    background:var(--bg); padding:0 6px; font-weight:600; white-space:nowrap; }
  .zone-note { position:absolute; left:14px; right:14px; bottom:8px; font-size:11px;
    color:var(--muted); line-height:1.4; opacity:.94; }
</style>
</head>
<body>
<h1>熵的账本：留痕就是可回放的记忆，忘掉的判断才算丢</h1>
<div class="sub">主张 A8 · 篇12 抽象结构 —— 判断主链 留痕入账 → 侧挂审计账本 可回放回流：没记下来的判断即熵漏，记忆让熵被计量而非消失</div>
<div class="stage">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700">
  <polyline points="250.0,245.0 250.0,405.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="250.0" cy="245.0" r="2.6" fill="var(--line)"/><circle cx="250.0" cy="405.0" r="3.0" fill="var(--line)"/>
    <rect x="236.8" y="310.0" width="26.4" height="18.0" rx="4" fill="var(--bg)"/><text x="250.0" y="325.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">留痕</text>
    <polyline points="250.0,405.0 250.0,560.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="250.0" cy="405.0" r="2.6" fill="var(--line)"/><circle cx="250.0" cy="560.0" r="3.0" fill="var(--line)"/>
    <polyline points="250.0,405.0 485.0,405.0 485.0,245.0 720.0,245.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="250.0" cy="405.0" r="2.6" fill="var(--line)"/><circle cx="720.0" cy="245.0" r="3.0" fill="var(--line)"/>
    <rect x="471.8" y="310.0" width="26.4" height="18.0" rx="4" fill="var(--bg)"/><text x="485.0" y="325.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">入账</text>
    <polyline points="720.0,405.0 485.0,405.0 485.0,560.0 250.0,560.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="720.0" cy="405.0" r="2.6" fill="var(--line)"/><circle cx="250.0" cy="560.0" r="3.0" fill="var(--line)"/>
    <rect x="471.8" y="470.0" width="26.4" height="18.0" rx="4" fill="var(--bg)"/><text x="485.0" y="485.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">回放</text>
  </svg>
  <div class="zone tinted" style="left:60px;top:120px;width:400px;height:520px"><span class="zone-label">判断主链</span><span class="zone-note">决策 → 留痕 → 回流</span></div>
    <div class="node input" style="left:120px;top:200px;width:260px;height:90px"><b>一次决策</b><small>判断发生的地方</small></div>
    <div class="node process" style="left:120px;top:360px;width:260px;height:90px"><b>留痕记录</b><small>谁判的 · 依据什么 · 怎么复核</small></div>
    <div class="node process" style="left:120px;top:520px;width:260px;height:80px"><b>回流成规</b><small>把账本里的结论编译回规则</small></div>
    <div class="zone tinted hl" style="left:520px;top:120px;width:400px;height:520px"><span class="zone-label">账本层 · 侧挂</span><span class="zone-note">随主链留痕，可随时回放来路</span></div>
    <div class="node storage" style="left:590px;top:200px;width:260px;height:90px"><b>decision.db</b><small>结构化决策缓存</small></div>
    <div class="node storage" style="left:590px;top:360px;width:260px;height:90px"><b>审计链 · 可回放</b><small>每一步都有快照</small></div>
    <div class="node risk" style="left:590px;top:520px;width:260px;height:80px"><b>忘掉的熵</b><small>没留痕的判断即丢失</small></div>
</div>
</body>
</html>
