<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>双层：元层造系统，产品层在系统里，产物单向下发</title>
<style>

  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b;
    --neutral:#e2e8f0; --input:#bfdbfe; --process:#c7d2fe; --storage:#99f6e4;
    --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#a3adbd;
    --line:#94a3b8; --neutral:#334155; --input:#1d4ed8; --process:#4338ca; --storage:#0f766e;
    --external:#92400e; --risk:#991b1b; --wiki:#5b4b9e; } }
  @media print {
    :root { color-scheme: light; --bg:#ffffff; --fg:#111827; --muted:#4b5563; --line:#6b7280;
      --neutral:#e5e7eb; --input:#bfdbfe; --process:#c7d2fe; --storage:#a7f3d0;
      --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
    body { margin:0; }
    .stage { border:0.025in solid #6b7280; break-inside:avoid; }
    .node, .zone { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  body { background:var(--bg); color:var(--fg); margin:16px; line-height:1.525; font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:17px; margin:0 0 4px; font-weight:600; letter-spacing:.025em; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.55; }
  .stage { position:relative; width:1000px; height:820px; border:1px solid var(--line); border-radius:8px; margin-top:8px; overflow:hidden; }
  svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .node { position:absolute; border-radius:8px; border:1.4px solid; padding:6px 10px; box-sizing:border-box;
    font-size:12.5px; display:flex; flex-direction:column; justify-content:center; z-index:2; color:var(--fg); }
  .node b { font-weight:600; }
  .node small { font-size:10px; color:var(--fg); opacity:.72; margin-top:2px; line-height:1.3; }
  .node.neutral   { background:var(--neutral); border-color:var(--line); }
  .node.input     { background:var(--input);   border-color:var(--line); }
  .node.process   { background:var(--process); border-color:var(--line); }
  .node.storage   { background:var(--storage); border-color:var(--line); }
  .node.external  { background:var(--external);border-color:var(--line); }
  .node.risk      { background:var(--risk);    border-color:var(--line); }
  .zone { position:absolute; border:1.4px dashed var(--line); border-radius:10px; z-index:1; }
  .zone.tinted { background:color-mix(in srgb, var(--line) 7%, transparent); }
  .zone.hl { border-style:solid; border-width:2px; border-color:var(--process); background:color-mix(in srgb, var(--process) 8%, transparent); }
  .zone-label { position:absolute; top:-4px; left:10px; font-size:12px; color:var(--muted);
    background:var(--bg); padding:0 6px; font-weight:600; white-space:nowrap; }
  .zone-note { position:absolute; left:14px; right:14px; bottom:8px; font-size:11px;
    color:var(--muted); line-height:1.4; opacity:.94; }
</style>
</head>
<body>
<h1>双层：元层造系统，产品层在系统里，产物单向下发</h1>
<div class="sub">主张 A9 · 篇13 抽象结构 —— 元层工厂（造系统）→ 产物下发 → 产品层车间（在系统里干活）：跨层只走一条 k4 单向回流，各自记账</div>
<div class="stage">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820">
  <polyline points="250.0,165.0 380.0,165.0 510.0,165.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="250.0" cy="165.0" r="2.6" fill="var(--line)"/><circle cx="510.0" cy="165.0" r="3.0" fill="var(--line)"/>
    <polyline points="510.0,165.0 640.0,165.0 770.0,165.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="510.0" cy="165.0" r="2.6" fill="var(--line)"/><circle cx="770.0" cy="165.0" r="3.0" fill="var(--line)"/>
    <polyline points="770.0,165.0 635.0,165.0 635.0,370.0 500.0,370.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="770.0" cy="165.0" r="2.6" fill="var(--line)"/><circle cx="500.0" cy="370.0" r="3.0" fill="var(--line)"/>
    <rect x="607.4" y="255.0" width="55.2" height="18.0" rx="4" fill="var(--bg)"/><text x="635.0" y="270.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">下发 P13</text>
    <polyline points="500.0,370.0 505.0,370.0 505.0,605.0 510.0,605.0" fill="none" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="6,4"/><circle cx="500.0" cy="370.0" r="2.6" fill="var(--line)"/><circle cx="510.0" cy="605.0" r="3.0" fill="var(--line)"/>
    <rect x="481.0" y="470.0" width="48.0" height="18.0" rx="4" fill="var(--bg)"/><text x="505.0" y="485.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">k4 单向</text>
    <polyline points="250.0,605.0 380.0,605.0 510.0,605.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="250.0" cy="605.0" r="2.6" fill="var(--line)"/><circle cx="510.0" cy="605.0" r="3.0" fill="var(--line)"/>
    <polyline points="510.0,605.0 640.0,605.0 770.0,605.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="510.0" cy="605.0" r="2.6" fill="var(--line)"/><circle cx="770.0" cy="605.0" r="3.0" fill="var(--line)"/>
  </svg>
  <div class="zone tinted hl" style="left:100px;top:60px;width:800px;height:220px"><span class="zone-label">元层工厂 · 造系统</span><span class="zone-note">元 Agent 拆单 / 派活 / 验收</span></div>
    <div class="node process" style="left:160px;top:120px;width:180px;height:90px"><b>规划 · WBS</b><small>拆单自带验收口径</small></div>
    <div class="node process" style="left:420px;top:120px;width:180px;height:90px"><b>分配资源</b><small>可并行的子任务</small></div>
    <div class="node process" style="left:680px;top:120px;width:180px;height:90px"><b>隔离验收</b><small>三权在元层闭环</small></div>
    <div class="zone tinted" style="left:200px;top:330px;width:600px;height:80px"><span class="zone-label">产物下发 · 只走单向</span><span class="zone-note">k4 单向回流喉口</span></div>
    <div class="zone tinted" style="left:100px;top:500px;width:800px;height:220px"><span class="zone-label">产品层车间 · 在系统里干活</span><span class="zone-note">产品 Agent 当班按 k 记忆运转</span></div>
    <div class="node process" style="left:160px;top:560px;width:180px;height:90px"><b>意图路由</b><small>判来意 → 落角色</small></div>
    <div class="node process" style="left:420px;top:560px;width:180px;height:90px"><b>产品 Agent 当班</b><small>只读自己的 k 层</small></div>
    <div class="node process" style="left:680px;top:560px;width:180px;height:90px"><b>留痕与复盘</b><small>经验攒在产品层</small></div>
</div>
</body>
</html>
