<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>选型=约束求解：候选解空间逐层收窄到唯一落点</title>
<style>

  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b;
    --neutral:#e2e8f0; --input:#bfdbfe; --process:#c7d2fe; --storage:#99f6e4;
    --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#a3adbd;
    --line:#94a3b8; --neutral:#334155; --input:#1d4ed8; --process:#4338ca; --storage:#0f766e;
    --external:#92400e; --risk:#991b1b; --wiki:#5b4b9e; } }
  @media print {
    :root { color-scheme: light; --bg:#ffffff; --fg:#111827; --muted:#4b5563; --line:#6b7280;
      --neutral:#e5e7eb; --input:#bfdbfe; --process:#c7d2fe; --storage:#a7f3d0;
      --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
    body { margin:0; }
    .stage { border:0.025in solid #6b7280; break-inside:avoid; }
    .node, .zone { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  body { background:var(--bg); color:var(--fg); margin:16px; line-height:1.525; font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:17px; margin:0 0 4px; font-weight:600; letter-spacing:.025em; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.55; }
  .stage { position:relative; width:760px; height:920px; border:1px solid var(--line); border-radius:8px; margin-top:8px; overflow:hidden; }
  svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .node { position:absolute; border-radius:8px; border:1.4px solid; padding:6px 10px; box-sizing:border-box;
    font-size:12.5px; display:flex; flex-direction:column; justify-content:center; z-index:2; color:var(--fg); }
  .node b { font-weight:600; }
  .node small { font-size:10px; color:var(--fg); opacity:.72; margin-top:2px; line-height:1.3; }
  .node.neutral   { background:var(--neutral); border-color:var(--line); }
  .node.input     { background:var(--input);   border-color:var(--line); }
  .node.process   { background:var(--process); border-color:var(--line); }
  .node.storage   { background:var(--storage); border-color:var(--line); }
  .node.external  { background:var(--external);border-color:var(--line); }
  .node.risk      { background:var(--risk);    border-color:var(--line); }
  .zone { position:absolute; border:1.4px dashed var(--line); border-radius:10px; z-index:1; }
  .zone.tinted { background:color-mix(in srgb, var(--line) 7%, transparent); }
  .zone.hl { border-style:solid; border-width:2px; border-color:var(--process); background:color-mix(in srgb, var(--process) 8%, transparent); }
  .zone-label { position:absolute; top:-4px; left:10px; font-size:12px; color:var(--muted);
    background:var(--bg); padding:0 6px; font-weight:600; white-space:nowrap; }
  .zone-note { position:absolute; left:14px; right:14px; bottom:8px; font-size:11px;
    color:var(--muted); line-height:1.4; opacity:.94; }
</style>
</head>
<body>
<h1>选型=约束求解：候选解空间逐层收窄到唯一落点</h1>
<div class="sub">主张 A3 · 篇4 抽象结构 —— 候选集经能力/成本/速度/收口逐层收缩，收敛到唯一可证实的解</div>
<div class="stage">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920">
  <polyline points="380.0,310.0 380.0,450.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="380.0" cy="310.0" r="2.6" fill="var(--line)"/><circle cx="380.0" cy="450.0" r="3.0" fill="var(--line)"/>
    <rect x="366.8" y="365.0" width="26.4" height="18.0" rx="4" fill="var(--bg)"/><text x="380.0" y="380.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">收窄</text>
    <polyline points="380.0,450.0 380.0,590.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="380.0" cy="450.0" r="2.6" fill="var(--line)"/><circle cx="380.0" cy="590.0" r="3.0" fill="var(--line)"/>
    <rect x="363.2" y="505.0" width="33.6" height="18.0" rx="4" fill="var(--bg)"/><text x="380.0" y="520.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">再收窄</text>
    <polyline points="380.0,590.0 380.0,730.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="380.0" cy="590.0" r="2.6" fill="var(--line)"/><circle cx="380.0" cy="730.0" r="3.0" fill="var(--line)"/>
    <rect x="366.8" y="645.0" width="26.4" height="18.0" rx="4" fill="var(--bg)"/><text x="380.0" y="660.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">收口</text>
    <polyline points="380.0,730.0 380.0,850.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="380.0" cy="730.0" r="2.6" fill="var(--line)"/><circle cx="380.0" cy="850.0" r="3.0" fill="var(--line)"/>
    <rect x="366.8" y="780.0" width="26.4" height="18.0" rx="4" fill="var(--bg)"/><text x="380.0" y="795.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">锁定</text>
  </svg>
  <div class="zone tinted hl" style="left:60px;top:40px;width:640px;height:180px"><span class="zone-label">候选解空间</span><span class="zone-note">全部可进入求解的候选项</span></div>
    <div class="node input" style="left:110px;top:100px;width:130px;height:60px"><b>候选 A</b><small>进入求解</small></div>
    <div class="node input" style="left:300px;top:100px;width:130px;height:60px"><b>候选 B</b><small>进入求解</small></div>
    <div class="node input" style="left:490px;top:100px;width:130px;height:60px"><b>候选 C</b><small>进入求解</small></div>
    <div class="node process" style="left:160px;top:270px;width:440px;height:80px"><b>能力门禁</b><small>硬约束硬性排他</small></div>
    <div class="node process" style="left:240px;top:410px;width:280px;height:80px"><b>成本门禁</b><small>软约束打分排序</small></div>
    <div class="node process" style="left:310px;top:550px;width:140px;height:80px"><b>速度门禁</b><small>继续收窄一档</small></div>
    <div class="node process" style="left:310px;top:690px;width:140px;height:80px"><b>门禁收口</b><small>显式失败或选中</small></div>
    <div class="node storage" style="left:300px;top:820px;width:160px;height:60px"><b>唯一落点</b><small>锁定模型+配置+理由</small></div>
</div>
</body>
</html>
