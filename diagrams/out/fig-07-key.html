<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>基准对照 Gauge：一句话只有说清『什么会推翻它』，才配被打分</title>
<style>

  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b;
    --neutral:#e2e8f0; --input:#bfdbfe; --process:#c7d2fe; --storage:#99f6e4;
    --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#a3adbd;
    --line:#94a3b8; --neutral:#334155; --input:#1d4ed8; --process:#4338ca; --storage:#0f766e;
    --external:#92400e; --risk:#991b1b; --wiki:#5b4b9e; } }
  @media print {
    :root { color-scheme: light; --bg:#ffffff; --fg:#111827; --muted:#4b5563; --line:#6b7280;
      --neutral:#e5e7eb; --input:#bfdbfe; --process:#c7d2fe; --storage:#a7f3d0;
      --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
    body { margin:0; }
    .stage { border:0.025in solid #6b7280; break-inside:avoid; }
    .node, .zone { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  body { background:var(--bg); color:var(--fg); margin:16px; line-height:1.525; font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:17px; margin:0 0 4px; font-weight:600; letter-spacing:.025em; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.55; }
  .stage { position:relative; width:1320px; height:540px; border:1px solid var(--line); border-radius:8px; margin-top:8px; overflow:hidden; }
  svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .node { position:absolute; border-radius:8px; border:1.4px solid; padding:6px 10px; box-sizing:border-box;
    font-size:12.5px; display:flex; flex-direction:column; justify-content:center; z-index:2; color:var(--fg); }
  .node b { font-weight:600; }
  .node small { font-size:10px; color:var(--fg); opacity:.72; margin-top:2px; line-height:1.3; }
  .node.neutral   { background:var(--neutral); border-color:var(--line); }
  .node.input     { background:var(--input);   border-color:var(--line); }
  .node.process   { background:var(--process); border-color:var(--line); }
  .node.storage   { background:var(--storage); border-color:var(--line); }
  .node.external  { background:var(--external);border-color:var(--line); }
  .node.risk      { background:var(--risk);    border-color:var(--line); }
  .zone { position:absolute; border:1.4px dashed var(--line); border-radius:10px; z-index:1; }
  .zone.tinted { background:color-mix(in srgb, var(--line) 7%, transparent); }
  .zone.hl { border-style:solid; border-width:2px; border-color:var(--process); background:color-mix(in srgb, var(--process) 8%, transparent); }
  .zone-label { position:absolute; top:-4px; left:10px; font-size:12px; color:var(--muted);
    background:var(--bg); padding:0 6px; font-weight:600; white-space:nowrap; }
  .zone-note { position:absolute; left:14px; right:14px; bottom:8px; font-size:11px;
    color:var(--muted); line-height:1.4; opacity:.94; }
</style>
</head>
<body>
<h1>基准对照 Gauge：一句话只有说清『什么会推翻它』，才配被打分</h1>
<div class="sub">A4 · 宣称要对齐事实，得先可证伪 —— 承第六篇《少数派也能对》</div>
<div class="stage">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 540">
  <polyline points="120.0,270.0 262.5,270.0 262.5,125.0 405.0,125.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="120.0" cy="270.0" r="2.6" fill="var(--line)"/><circle cx="405.0" cy="125.0" r="3.0" fill="var(--line)"/>
    <rect x="202.5" y="180.0" width="120.0" height="18.0" rx="4" fill="var(--bg)"/><text x="262.5" y="195.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">不说死的话，翻译成可推翻的断言</text>
    <polyline points="405.0,125.0 405.0,305.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="405.0" cy="125.0" r="2.6" fill="var(--line)"/><circle cx="405.0" cy="305.0" r="3.0" fill="var(--line)"/>
    <rect x="359.4" y="195.0" width="91.2" height="18.0" rx="4" fill="var(--bg)"/><text x="405.0" y="210.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">为断言定一条基准读数线</text>
    <polyline points="405.0,305.0 707.5,305.0 707.5,250.0 1010.0,250.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="405.0" cy="305.0" r="2.6" fill="var(--line)"/><circle cx="1010.0" cy="250.0" r="3.0" fill="var(--line)"/>
    <rect x="663.0" y="262.5" width="84.0" height="18.0" rx="4" fill="var(--bg)"/><text x="705.0" y="277.5" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">读数对齐与否，出判定</text>
    <polyline points="405.0,305.0 552.5,305.0 552.5,470.0 700.0,470.0" fill="none" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="6,4"/><circle cx="405.0" cy="305.0" r="2.6" fill="var(--line)"/><circle cx="700.0" cy="470.0" r="3.0" fill="var(--line)"/>
    <rect x="506.9" y="375.0" width="91.2" height="18.0" rx="4" fill="var(--bg)"/><text x="552.5" y="390.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">反范式：读不出就打假分</text>
  </svg>
  <div class="node input" style="left:20px;top:220px;width:200px;height:100px"><b>一次宣称 claim</b><small>模型给出的话&#10;结论 / 理由 / 置信</small></div>
    <div class="node process" style="left:280px;top:80px;width:250px;height:90px"><b>揭成可推翻的断言</b><small>第一步先问&#10;什么证据能让它翻车</small></div>
    <div class="node storage" style="left:280px;top:250px;width:250px;height:110px"><b>基准对照 Gauge</b><small>一条能读数的标尺&#10;参考值 + 触发线</small></div>
    <div class="node storage" style="left:880px;top:180px;width:260px;height:140px"><b>判定：对齐 / 不对齐</b><small>读数对上证据就过&#10;过不了就退回重取证</small></div>
    <div class="node risk" style="left:590px;top:420px;width:220px;height:100px"><b>假分陷阱</b><small>不设标尺就打高分&#10;宣称越模糊分越虚</small></div>
</div>
</body>
</html>
