<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>自指判定陷入等效性困境，唯有外部参照可证</title>
<style>

  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b;
    --neutral:#e2e8f0; --input:#bfdbfe; --process:#c7d2fe; --storage:#99f6e4;
    --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#a3adbd;
    --line:#94a3b8; --neutral:#334155; --input:#1d4ed8; --process:#4338ca; --storage:#0f766e;
    --external:#92400e; --risk:#991b1b; --wiki:#5b4b9e; } }
  @media print {
    :root { color-scheme: light; --bg:#ffffff; --fg:#111827; --muted:#4b5563; --line:#6b7280;
      --neutral:#e5e7eb; --input:#bfdbfe; --process:#c7d2fe; --storage:#a7f3d0;
      --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
    body { margin:0; }
    .stage { border:0.025in solid #6b7280; break-inside:avoid; }
    .node, .zone { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  body { background:var(--bg); color:var(--fg); margin:16px; line-height:1.525; font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:17px; margin:0 0 4px; font-weight:600; letter-spacing:.025em; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.55; }
  .stage { position:relative; width:1500px; height:700px; border:1px solid var(--line); border-radius:8px; margin-top:8px; overflow:hidden; }
  svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .node { position:absolute; border-radius:8px; border:1.4px solid; padding:6px 10px; box-sizing:border-box;
    font-size:12.5px; display:flex; flex-direction:column; justify-content:center; z-index:2; color:var(--fg); }
  .node b { font-weight:600; }
  .node small { font-size:10px; color:var(--fg); opacity:.72; margin-top:2px; line-height:1.3; }
  .node.neutral   { background:var(--neutral); border-color:var(--line); }
  .node.input     { background:var(--input);   border-color:var(--line); }
  .node.process   { background:var(--process); border-color:var(--line); }
  .node.storage   { background:var(--storage); border-color:var(--line); }
  .node.external  { background:var(--external);border-color:var(--line); }
  .node.risk      { background:var(--risk);    border-color:var(--line); }
  .zone { position:absolute; border:1.4px dashed var(--line); border-radius:10px; z-index:1; }
  .zone.tinted { background:color-mix(in srgb, var(--line) 7%, transparent); }
  .zone.hl { border-style:solid; border-width:2px; border-color:var(--process); background:color-mix(in srgb, var(--process) 8%, transparent); }
  .zone-label { position:absolute; top:-4px; left:10px; font-size:12px; color:var(--muted);
    background:var(--bg); padding:0 6px; font-weight:600; white-space:nowrap; }
  .zone-note { position:absolute; left:14px; right:14px; bottom:8px; font-size:11px;
    color:var(--muted); line-height:1.4; opacity:.94; }
</style>
</head>
<body>
<h1>自指判定陷入等效性困境，唯有外部参照可证</h1>
<div class="sub">主张 A1 · 篇 1 抽象结构 —— 单 Agent 内部自环 vs 外部可证参照：自指无法自证</div>
<div class="stage">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700">
  <polyline points="190.0,202.0 332.5,202.0 475.0,202.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="190.0" cy="202.0" r="2.6" fill="var(--line)"/><circle cx="475.0" cy="202.0" r="3.0" fill="var(--line)"/>
    <polyline points="475.0,202.0 410.0,202.0 410.0,386.0 345.0,386.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="475.0" cy="202.0" r="2.6" fill="var(--line)"/><circle cx="345.0" cy="386.0" r="3.0" fill="var(--line)"/>
    <polyline points="345.0,386.0 275.0,386.0 275.0,554.0 205.0,554.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="345.0" cy="386.0" r="2.6" fill="var(--line)"/><circle cx="205.0" cy="554.0" r="3.0" fill="var(--line)"/>
    <polyline points="205.0,554.0 197.5,554.0 197.5,202.0 190.0,202.0" fill="none" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="6,4"/><circle cx="205.0" cy="554.0" r="2.6" fill="var(--line)"/><circle cx="190.0" cy="202.0" r="3.0" fill="var(--line)"/>
    <rect x="184.3" y="314.0" width="26.4" height="18.0" rx="4" fill="var(--bg)"/><text x="197.5" y="329.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">自环</text>
    <polyline points="345.0,386.0 717.5,386.0 717.5,206.0 1090.0,206.0" fill="none" stroke="var(--line)" stroke-width="1.6" stroke-dasharray="6,4"/><circle cx="345.0" cy="386.0" r="2.6" fill="var(--line)"/><circle cx="1090.0" cy="206.0" r="3.0" fill="var(--line)"/>
    <rect x="700.7" y="281.0" width="33.6" height="18.0" rx="4" fill="var(--bg)"/><text x="717.5" y="296.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">不自证</text>
  </svg>
  <div class="zone tinted hl" style="left:40px;top:60px;width:620px;height:600px"><span class="zone-label">单 Agent 内部 · 自指环</span><span class="zone-note">输入与输出咬成一个闭环</span></div>
    <div class="node input" style="left:90px;top:160px;width:200px;height:84px"><b>输入一次</b><small>自指判定接收外部世界</small></div>
    <div class="node process" style="left:330px;top:160px;width:290px;height:84px"><b>自指判定</b><small>用自己的标准裁自己</small></div>
    <div class="node risk" style="left:90px;top:340px;width:510px;height:92px"><b>输出·不可自证</b><small>环内无他者，置信度无法独立核对</small></div>
    <div class="node risk" style="left:90px;top:510px;width:230px;height:88px"><b>环内回注</b><small>只得在环内绕圈自证</small></div>
    <div class="zone tinted" style="left:730px;top:60px;width:730px;height:600px"><span class="zone-label">外部可证参照</span><span class="zone-note">跳出自指的第三只手</span></div>
    <div class="node storage" style="left:790px;top:160px;width:600px;height:92px"><b>可证基准</b><small>来自外部、可复现的标准</small></div>
    <div class="node storage" style="left:790px;top:330px;width:600px;height:92px"><b>独立复核</b><small>另一个视角再验一遍</small></div>
    <div class="node storage" style="left:790px;top:510px;width:600px;height:88px"><b>可回放证据链</b><small>每一步都留痕可查</small></div>
</div>
</body>
</html>
