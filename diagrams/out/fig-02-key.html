<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>分工是把判断切得可问责：从一次前向推理到三层责任链</title>
<style>

  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b;
    --neutral:#e2e8f0; --input:#bfdbfe; --process:#c7d2fe; --storage:#99f6e4;
    --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#a3adbd;
    --line:#94a3b8; --neutral:#334155; --input:#1d4ed8; --process:#4338ca; --storage:#0f766e;
    --external:#92400e; --risk:#991b1b; --wiki:#5b4b9e; } }
  @media print {
    :root { color-scheme: light; --bg:#ffffff; --fg:#111827; --muted:#4b5563; --line:#6b7280;
      --neutral:#e5e7eb; --input:#bfdbfe; --process:#c7d2fe; --storage:#a7f3d0;
      --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
    body { margin:0; }
    .stage { border:0.025in solid #6b7280; break-inside:avoid; }
    .node, .zone { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  body { background:var(--bg); color:var(--fg); margin:16px; line-height:1.525; font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:17px; margin:0 0 4px; font-weight:600; letter-spacing:.025em; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.55; }
  .stage { position:relative; width:1360px; height:860px; border:1px solid var(--line); border-radius:8px; margin-top:8px; overflow:hidden; }
  svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .node { position:absolute; border-radius:8px; border:1.4px solid; padding:6px 10px; box-sizing:border-box;
    font-size:12.5px; display:flex; flex-direction:column; justify-content:center; z-index:2; color:var(--fg); }
  .node b { font-weight:600; }
  .node small { font-size:10px; color:var(--fg); opacity:.72; margin-top:2px; line-height:1.3; }
  .node.neutral   { background:var(--neutral); border-color:var(--line); }
  .node.input     { background:var(--input);   border-color:var(--line); }
  .node.process   { background:var(--process); border-color:var(--line); }
  .node.storage   { background:var(--storage); border-color:var(--line); }
  .node.external  { background:var(--external);border-color:var(--line); }
  .node.risk      { background:var(--risk);    border-color:var(--line); }
  .zone { position:absolute; border:1.4px dashed var(--line); border-radius:10px; z-index:1; }
  .zone.tinted { background:color-mix(in srgb, var(--line) 7%, transparent); }
  .zone.hl { border-style:solid; border-width:2px; border-color:var(--process); background:color-mix(in srgb, var(--process) 8%, transparent); }
  .zone-label { position:absolute; top:-4px; left:10px; font-size:12px; color:var(--muted);
    background:var(--bg); padding:0 6px; font-weight:600; white-space:nowrap; }
  .zone-note { position:absolute; left:14px; right:14px; bottom:8px; font-size:11px;
    color:var(--muted); line-height:1.4; opacity:.94; }
</style>
</head>
<body>
<h1>分工是把判断切得可问责：从一次前向推理到三层责任链</h1>
<div class="sub">A2 · 分工不是人多，是把一个黑盒切成一组能彼此指认责任的环节</div>
<div class="stage">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 860">
  <polyline points="204.0,270.0 359.5,270.0 359.5,350.0 515.0,350.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="204.0" cy="270.0" r="2.6" fill="var(--line)"/><circle cx="515.0" cy="350.0" r="3.0" fill="var(--line)"/>
    <rect x="373.2" y="295.0" width="69.6" height="18.0" rx="4" fill="var(--bg)"/><text x="408.0" y="310.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">为什么能被切开？</text>
    <polyline points="515.0,350.0 753.0,350.0 753.0,158.0 991.0,158.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="515.0" cy="350.0" r="2.6" fill="var(--line)"/><circle cx="991.0" cy="158.0" r="3.0" fill="var(--line)"/>
    <rect x="721.8" y="205.0" width="62.4" height="18.0" rx="4" fill="var(--bg)"/><text x="753.0" y="220.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">先定责任的刀口</text>
    <polyline points="991.0,158.0 991.0,288.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="991.0" cy="158.0" r="2.6" fill="var(--line)"/><circle cx="991.0" cy="288.0" r="3.0" fill="var(--line)"/>
    <rect x="967.0" y="208.0" width="48.0" height="18.0" rx="4" fill="var(--bg)"/><text x="991.0" y="223.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">派活与门禁</text>
    <polyline points="991.0,288.0 991.0,418.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="991.0" cy="288.0" r="2.6" fill="var(--line)"/><circle cx="991.0" cy="418.0" r="3.0" fill="var(--line)"/>
    <rect x="970.6" y="338.0" width="40.8" height="18.0" rx="4" fill="var(--bg)"/><text x="991.0" y="353.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">证据留痕</text>
    <polyline points="991.0,418.0 991.0,562.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="991.0" cy="418.0" r="2.6" fill="var(--line)"/><circle cx="991.0" cy="562.0" r="3.0" fill="var(--line)"/>
    <rect x="967.0" y="473.0" width="48.0" height="18.0" rx="4" fill="var(--bg)"/><text x="991.0" y="488.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">规格化结算</text>
  </svg>
  <div class="zone" style="left:24px;top:50px;width:360px;height:640px"><span class="zone-label">重构前 · 单点黑盒</span></div>
    <div class="node risk" style="left:60px;top:170px;width:288px;height:200px"><b>一次前向推理</b><small>理解 · 拆解 · 执行 · 自检&#10;四环熔在一处，出错无法定位</small></div>
    <div class="node external" style="left:60px;top:470px;width:288px;height:84px"><b>没有人能负责</b><small>因为没有任何一环能单独被定罪</small></div>
    <div class="zone" style="left:440px;top:50px;width:150px;height:640px"><span class="zone-label">切 / 重构</span></div>
    <div class="node process" style="left:468px;top:240px;width:94px;height:220px"><b>切开&#10;分工缝合</b><small>每刀都在制造一条问责缝</small></div>
    <div class="zone" style="left:646px;top:50px;width:690px;height:640px"><span class="zone-label">重构后 · 三层分工（调度 / 执行 / 知识）</span></div>
    <div class="node process" style="left:676px;top:120px;width:630px;height:76px"><b>调度层</b><small>谁负责拆问题、选方案、把话派给谁</small></div>
    <div class="node process" style="left:676px;top:250px;width:630px;height:76px"><b>执行层</b><small>谁负责产出论证、对抗审查、给出可测的中间量</small></div>
    <div class="node process" style="left:676px;top:380px;width:630px;height:76px"><b>知识层</b><small>谁负责记录结论、校准可信度、沉淀教训</small></div>
    <div class="node external" style="left:676px;top:520px;width:630px;height:84px"><b>每一环都能被指认与复核</b><small>分工带来的不是更聪明，而是可问责——这是判断可管理的开关</small></div>
</div>
</body>
</html>
