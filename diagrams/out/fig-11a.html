<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>判断力从人身上迁移，落到可编程可验证的系统里</title>
<style>

  :root { color-scheme: light dark; --bg:#f8fafc; --fg:#172033; --muted:#5b6475; --line:#64748b;
    --neutral:#e2e8f0; --input:#bfdbfe; --process:#c7d2fe; --storage:#99f6e4;
    --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --fg:#e5e7eb; --muted:#a3adbd;
    --line:#94a3b8; --neutral:#334155; --input:#1d4ed8; --process:#4338ca; --storage:#0f766e;
    --external:#92400e; --risk:#991b1b; --wiki:#5b4b9e; } }
  @media print {
    :root { color-scheme: light; --bg:#ffffff; --fg:#111827; --muted:#4b5563; --line:#6b7280;
      --neutral:#e5e7eb; --input:#bfdbfe; --process:#c7d2fe; --storage:#a7f3d0;
      --external:#fde68a; --risk:#fecaca; --wiki:#ddd6fe; }
    body { margin:0; }
    .stage { border:0.025in solid #6b7280; break-inside:avoid; }
    .node, .zone { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }

  body { background:var(--bg); color:var(--fg); margin:16px; line-height:1.525; font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:17px; margin:0 0 4px; font-weight:600; letter-spacing:.025em; }
  .sub { font-size:12px; color:var(--muted); margin-bottom:12px; line-height:1.55; }
  .stage { position:relative; width:1180px; height:720px; border:1px solid var(--line); border-radius:8px; margin-top:8px; overflow:hidden; }
  svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .node { position:absolute; border-radius:8px; border:1.4px solid; padding:6px 10px; box-sizing:border-box;
    font-size:12.5px; display:flex; flex-direction:column; justify-content:center; z-index:2; color:var(--fg); }
  .node b { font-weight:600; }
  .node small { font-size:10px; color:var(--fg); opacity:.72; margin-top:2px; line-height:1.3; }
  .node.neutral   { background:var(--neutral); border-color:var(--line); }
  .node.input     { background:var(--input);   border-color:var(--line); }
  .node.process   { background:var(--process); border-color:var(--line); }
  .node.storage   { background:var(--storage); border-color:var(--line); }
  .node.external  { background:var(--external);border-color:var(--line); }
  .node.risk      { background:var(--risk);    border-color:var(--line); }
  .zone { position:absolute; border:1.4px dashed var(--line); border-radius:10px; z-index:1; }
  .zone.tinted { background:color-mix(in srgb, var(--line) 7%, transparent); }
  .zone.hl { border-style:solid; border-width:2px; border-color:var(--process); background:color-mix(in srgb, var(--process) 8%, transparent); }
  .zone-label { position:absolute; top:-4px; left:10px; font-size:12px; color:var(--muted);
    background:var(--bg); padding:0 6px; font-weight:600; white-space:nowrap; }
  .zone-note { position:absolute; left:14px; right:14px; bottom:8px; font-size:11px;
    color:var(--muted); line-height:1.4; opacity:.94; }
</style>
</head>
<body>
<h1>判断力从人身上迁移，落到可编程可验证的系统里</h1>
<div class="sub">主张 A8 · 篇11 抽象结构 —— 左人脑作坊、中间改写带、右可编程系统：同类脑力劳动被生产方式取代，而非效率提一档</div>
<div class="stage">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720">
  <polyline points="230.0,280.0 415.0,280.0 415.0,310.0 600.0,310.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="230.0" cy="280.0" r="2.6" fill="var(--line)"/><circle cx="600.0" cy="310.0" r="3.0" fill="var(--line)"/>
    <rect x="421.8" y="280.0" width="26.4" height="18.0" rx="4" fill="var(--bg)"/><text x="435.0" y="295.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">迁移</text>
    <polyline points="600.0,450.0 790.0,450.0 790.0,305.0 980.0,305.0" fill="none" stroke="var(--line)" stroke-width="1.6" /><circle cx="600.0" cy="450.0" r="2.6" fill="var(--line)"/><circle cx="980.0" cy="305.0" r="3.0" fill="var(--line)"/>
    <rect x="776.8" y="365.0" width="26.4" height="18.0" rx="4" fill="var(--bg)"/><text x="790.0" y="380.0" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="middle">改写</text>
  </svg>
  <div class="zone tinted" style="left:40px;top:140px;width:380px;height:500px"><span class="zone-label">人脑作坊</span><span class="zone-note">判断停留在个人脑内</span></div>
    <div class="node external" style="left:90px;top:230px;width:280px;height:100px"><b>不可分工的判断</b><small>再聪明也只有独一份</small></div>
    <div class="node external" style="left:90px;top:400px;width:280px;height:100px"><b>经验私有</b><small>不可校验 · 无法审计</small></div>
    <div class="zone tinted hl" style="left:460px;top:140px;width:280px;height:500px"><span class="zone-label">改写带</span><span class="zone-note">同一种脑力劳动&#10;被生产方式取代</span></div>
    <div class="node process" style="left:500px;top:260px;width:200px;height:100px"><b>拆分粒化</b><small>判断切成可复现步骤</small></div>
    <div class="node process" style="left:500px;top:400px;width:200px;height:100px"><b>登记为规则</b><small>逐步变成配置而非天赋</small></div>
    <div class="zone tinted" style="left:800px;top:140px;width:340px;height:500px"><span class="zone-label">可编程系统</span><span class="zone-note">判断力落进可验证的机器</span></div>
    <div class="node storage" style="left:870px;top:250px;width:220px;height:110px"><b>三权复核流水</b><small>报告≠修复≠验证</small></div>
    <div class="node storage" style="left:870px;top:410px;width:220px;height:110px"><b>留痕账本</b><small>每一步都能回放</small></div>
</div>
</body>
</html>
